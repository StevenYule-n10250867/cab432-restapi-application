openapi: 3.0.0
info:
  title: CAB432 Media API
  version: 1.0.0
  description: REST API for video upload, jobs, and authentication using AWS Cognito + S3.

servers:
  - url: http://3.26.193.131:3000
    description: Public EC2 server
  - url: http://localhost:3000
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      description: Returns API health status.
      security: []   # public
      responses:
        "200":
          description: OK

  /config:
    get:
      summary: Config check
      description: Returns app config (safe values only).
      security: []   # public
      responses:
        "200":
          description: OK

  /auth/register:
    post:
      summary: Register a new user
      description: Registers a user in Cognito with email + password.
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                email:
                  type: string
              required: [username, password, email]
      responses:
        "200":
          description: User registered

  /auth/confirm:
    post:
      summary: Confirm a new user
      description: Confirms a user using a code from Cognito.
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                code:
                  type: string
              required: [username, code]
      responses:
        "200":
          description: User confirmed

  /auth/login:
    post:
      summary: User login
      description: Logs in a user with Cognito and returns a JWT.
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required: [username, password]
      responses:
        "200":
          description: Login successful

  /video/upload:
    post:
      summary: Upload a video file (server-mediated)
      description: Upload a file directly to the EC2 container (then pushed to S3).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video:
                  type: string
                  format: binary
      responses:
        "200":
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  filename:
                    type: string
                  s3Path:
                    type: string

  /video/upload-url:
    get:
      summary: Get pre-signed S3 upload URL
      description: Returns a temporary signed URL to upload directly to S3.
      security:
        - bearerAuth: []
      parameters:
        - name: filename
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns an S3 upload URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string

  /video/download-url:
    get:
      summary: Get pre-signed S3 download URL
      description: Returns a temporary signed URL to download a file from S3.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
            example: uploads/sample.mp4
      responses:
        "200":
          description: Returns an S3 download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl:
                    type: string

  /video/transcode:
    post:
      summary: Transcode an uploaded video
      description: Runs ffmpeg locally to transcode a file already uploaded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  example: sample.mp4
      responses:
        "200":
          description: Transcoding complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  output:
                    type: string

  /video/files:
    get:
      summary: List uploaded files
      description: Lists all uploaded files present in the uploads directory.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: string

  /jobs:
    get:
      summary: List jobs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Returns job list

    post:
      summary: Submit a job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                videoKey:
                  type: string
                preset:
                  type: string
              required: [videoKey, preset]
      responses:
        "200":
          description: Job submitted

  /admin/dashboard:
    get:
      summary: Admin dashboard
      description: Returns info for admin users only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin dashboard data
        "403":
          description: Admin access required
