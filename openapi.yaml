openapi: 3.0.0
info:
  title: CAB432 Media API
  version: 1.0.0
  description: REST API for video upload, jobs, and authentication using AWS Cognito + S3.

servers:
  - url: http://3.25.89.130:3000
    description: Public EC2 server
  - url: http://localhost:3000
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      description: Returns API health status.
      security: []   # public
      responses:
        "200":
          description: OK

  /config:
    get:
      summary: Config check
      description: Returns app config (safe values only).
      security: []   # public
      responses:
        "200":
          description: OK

  /auth/register:
    post:
      summary: Register a new user
      description: Registers a user in Cognito with email + password.
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                email:
                  type: string
              required: [username, password, email]
      responses:
        "200":
          description: User registered

  /auth/confirm:
    post:
      summary: Confirm a new user
      description: Confirms a user using a code from Cognito.
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                code:
                  type: string
              required: [username, code]
      responses:
        "200":
          description: User confirmed

  /auth/login:
    post:
      summary: User login
      description: Logs in a user with Cognito and returns a JWT.
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required: [username, password]
      responses:
        "200":
          description: Login successful

  /video/upload:
    post:
      summary: Upload a video file (server-mediated)
      description: Upload a file directly to the EC2 container (then pushed to S3).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video:
                  type: string
                  format: binary
      responses:
        "200":
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  filename:
                    type: string
                  s3Path:
                    type: string

  /video/upload-url:
    get:
      summary: Get pre-signed S3 upload URL
      description: Returns a temporary signed URL to upload directly to S3.
      security:
        - bearerAuth: []
      parameters:
        - name: filename
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns an S3 upload URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string

  /video/download-url:
    get:
      summary: Get pre-signed S3 download URL
      description: Returns a temporary signed URL to download a file from S3.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
            example: uploads/sample.mp4
      responses:
        "200":
          description: Returns an S3 download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl:
                    type: string

  /jobs/transcode:
    post:
      summary: Submit a transcode job
      description: Downloads from S3, runs ffmpeg, uploads output to S3, stores metadata in DynamoDB.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  example: sample.mp4
              required: [filename]
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
        "200":
          description: Example job record after completion
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  owner:
                    type: string
                  filename:
                    type: string
                  status:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  finishedAt:
                    type: string
                    format: date-time
                  elapsedMs:
                    type: integer
                  outputs:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        s3Uri:
                          type: string
                          example: s3://bucket/transcoded/transcoded-sample.mp4
                        downloadUrl:
                          type: string
                          example: https://presigned-url-to-video
                        sizeBytes:
                          type: integer
                        sha256:
                          type: string
                        meta:
                          type: object
                          properties:
                            format:
                              type: object
                            streams:
                              type: array

  /jobs/load:
    post:
      summary: Queue multiple transcode jobs for autoscaling test
      description: >
        Enqueues multiple jobs to the SQS queue to simulate load and test
        the autoscaling mechanism. Requires admin authorization.
      tags:
        - Jobs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  example: sample-30s.mp4
                count:
                  type: integer
                  example: 5
              required:
                - filename
                - count
      responses:
        '202':
          description: Jobs queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Queued 5 jobs for sample-30s.mp4
                  jobIds:
                    type: array
                    items:
                      type: string
                      example: 4e2e2b4c-72a7-4b1e-bc69-3e1f776f943c
        '400':
          description: Invalid input (missing filename or count)
        '401':
          description: Unauthorized – valid token required


  /jobs:
    get:
      summary: List all jobs for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    filename:
                      type: string
                    status:
                      type: string
                    createdAt:
                      type: string
                      format: date-time

  /jobs/{id}:
    get:
      summary: Get job details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job details
        "404":
          description: Job not found

  /jobs/{id}/report:
    get:
      summary: Get job report
      description: Returns HTML or JSON report for a job.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json]
      responses:
        "200":
          description: Job report (HTML or JSON)

  /admin/dashboard:
    get:
      summary: Admin dashboard
      description: Returns info for admin users only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin dashboard data
        "403":
          description: Admin access required
